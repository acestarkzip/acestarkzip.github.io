<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Portfolio</title>
    <style>
        :root {
            --bg-color: #0b0f17;
            --card-bg: rgba(22, 29, 45, 0.7);
            --border-color: rgba(255, 255, 255, 0.12);
            --accent-cyan: #00f2fe;
            --accent-purple: #7928ca;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); color: var(--text-main); }

        header {
            position: fixed; top: 0; width: 100%; height: 65px;
            background: rgba(11, 15, 23, 0.85); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 30px; z-index: 100;
        }
        .back-home { color: var(--accent-cyan); text-decoration: none; font-weight: 600; }

        .container { display: flex; margin-top: 65px; min-height: calc(100vh - 65px); }
        .sidebar {
            width: 280px; padding: 40px 20px; border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; align-items: center; gap: 20px;
        }
        .profile-circle {
            width: 140px; height: 140px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            display: flex; align-items: center; justify-content: center; font-weight: bold;
        }
        .nav-links { list-style: none; width: 100%; display: flex; flex-direction: column; gap: 10px; }
        .nav-links a {
            display: block; padding: 12px; text-align: center; border-radius: 12px;
            text-decoration: none; color: var(--text-sub); border: 1px solid var(--border-color);
        }
        .nav-links a:hover, .nav-links a.active { background: rgba(255,255,255,0.08); color: var(--text-main); border-color: var(--accent-cyan); }

        .content { flex: 1; padding: 50px; max-width: 900px; }
        .title { font-size: 2rem; margin-bottom: 30px; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .post-item {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 25px; margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .post-info h3 { margin-bottom: 8px; font-size: 1.2rem; }
        .post-info p { color: var(--text-sub); font-size: 0.9rem; }
        .date { color: var(--accent-cyan); font-size: 0.85rem; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <a href="../index.html" class="back-home">← 메인 포트폴리오로 돌아가기</a>
        <div>Blog Logs</div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <div class="profile-circle">Profile</div>
            <ul class="nav-links">
                <li><a href="../about-me/index.html">about me</a></li>
                <li><a href="../project/index.html">project</a></li>
                <li><a href="../blog/index.html" class="active">blog</a></li>
                <li><a href="../contact/index.html">contact</a></li>
            </ul>
        </aside>

        <main class="content">
            <h1 class="title">Recent Posts</h1>
            
            <div class="post-item">
                <div class="post-info">
                    <h3>깃허브 페이지 구축 과정 트러블 슈팅</h3>
                    <p>다크 테마 적용 및 서브 페이지 폴더 구조화 정리</p>
                </div>
                <span class="date">2026.10.29</span>
            </div>

            <div class="post-item">
                <div class="post-info">
                    <h3>모던 웹 디자인 트렌드와 CSS 라이브러리</h3>
                    <p>글래스모피즘(Glassmorphism)과 애니메이션 기법</p>
                </div>
                <span class="date">2026.10.20</span>
            </div>
        </main>
    </div>
</body>
</html>
