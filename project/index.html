<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Portfolio</title>
    <style>
        :root {
            --bg-color: #0b0f17;
            --card-bg: rgba(22, 29, 45, 0.7);
            --border-color: rgba(255, 255, 255, 0.12);
            --accent-cyan: #00f2fe;
            --accent-purple: #7928ca;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); color: var(--text-main); }

        header {
            position: fixed; top: 0; width: 100%; height: 65px;
            background: rgba(11, 15, 23, 0.85); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 30px; z-index: 100;
        }
        .back-home { color: var(--accent-cyan); text-decoration: none; font-weight: 600; }

        .container { display: flex; margin-top: 65px; min-height: calc(100vh - 65px); }
        .sidebar {
            width: 280px; padding: 40px 20px; border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; align-items: center; gap: 20px;
        }
        .profile-circle {
            width: 140px; height: 140px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            display: flex; align-items: center; justify-content: center; font-weight: bold;
        }
        .nav-links { list-style: none; width: 100%; display: flex; flex-direction: column; gap: 10px; }
        .nav-links a {
            display: block; padding: 12px; text-align: center; border-radius: 12px;
            text-decoration: none; color: var(--text-sub); border: 1px solid var(--border-color);
        }
        .nav-links a:hover, .nav-links a.active { background: rgba(255,255,255,0.08); color: var(--text-main); border-color: var(--accent-cyan); }

        .content { flex: 1; padding: 50px; }
        .title { font-size: 2rem; margin-bottom: 30px; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .project-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 25px; transition: transform 0.3s, border-color 0.3s;
        }
        .project-card:hover { transform: translateY(-5px); border-color: var(--accent-cyan); }
        .project-card h3 { margin-bottom: 10px; color: var(--text-main); }
        .project-card p { color: var(--text-sub); font-size: 0.95rem; line-height: 1.5; margin-bottom: 15px; }
        .tag { display: inline-block; padding: 4px 10px; border-radius: 20px; background: rgba(0,242,254,0.1); color: var(--accent-cyan); font-size: 0.8rem; }
    </style>
</head>
<body>
    <header>
        <a href="../index.html" class="back-home">← 메인 포트폴리오로 돌아가기</a>
        <div>Projects Archive</div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <div class="profile-circle">Profile</div>
            <ul class="nav-links">
                <li><a href="../about-me/index.html">about me</a></li>
                <li><a href="../project/index.html" class="active">project</a></li>
                <li><a href="../blog/index.html">blog</a></li>
                <li><a href="../contact/index.html">contact</a></li>
            </ul>
        </aside>

        <main class="content">
            <h1 class="title">All Projects</h1>
            <div class="grid">
                <div class="project-card">
                    <h3>프로젝트 1</h3>
                    <p>프로젝트 1에 대한 상세 설명입니다. 어떤 기술을 써서 만들었는지 적어보세요.</p>
                    <span class="tag">HTML/CSS</span>
                </div>
                <div class="project-card">
                    <h3>프로젝트 2</h3>
                    <p>프로젝트 2에 대한 상세 설명입니다. 반응형 및 모던 UI 적용 내용입니다.</p>
                    <span class="tag">JavaScript</span>
                </div>
                <div class="project-card">
                    <h3>프로젝트 3</h3>
                    <p>프로젝트 3에 대한 상세 설명입니다. 나만의 멋진 아이디어를 기록하세요.</p>
                    <span class="tag">React</span>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
